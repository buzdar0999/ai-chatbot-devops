<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AI Chatbot</title>
  <style>
    body { font-family: Arial, sans-serif; max-width: 600px; margin: 30px auto; padding: 0 15px; }
    #log { border: 1px solid #ccc; border-radius: 8px; height: 400px; overflow-y: auto; padding: 10px; }
    .me { text-align: right; color: #0a58ca; margin: 8px 0; }
    .bot { text-align: left; color: #222; margin: 8px 0; }
    #row { display: flex; gap: 8px; margin-top: 10px; }
    #msg { flex: 1; padding: 10px; }
    button { padding: 10px 18px; }
  </style>
</head>
<body>
  <h2>AI Chatbot</h2>
  <div id="log"></div>
  <div id="row">
    <input id="msg" placeholder="Type a message..." maxlength="2000">
    <button id="send">Send</button>
  </div>
  <script>
    const log = document.getElementById("log");
    const msg = document.getElementById("msg");

    function add(cls, text) {
      const d = document.createElement("div");
      d.className = cls;
      d.textContent = text;
      log.appendChild(d);
      log.scrollTop = log.scrollHeight;
    }

    async function send() {
      const text = msg.value.trim();
      if (!text) return;
      add("me", text);
      msg.value = "";
      try {
        const r = await fetch("/chat", {
          method: "POST",
          headers: { "Content-Type": "application/json" },
          body: JSON.stringify({ message: text })
        });
        const data = await r.json();
        add("bot", r.ok ? data.reply : "Error: " + (data.detail || "something went wrong"));
      } catch (e) {
        add("bot", "Error: could not reach the server");
      }
    }

    document.getElementById("send").onclick = send;
    msg.addEventListener("keydown", e => { if (e.key === "Enter") send(); });
  </script>
</body>
</html>
